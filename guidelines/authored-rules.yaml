# Engine rules written for the spec factory (not copied from a source text).
# build_rules.py merges these with the rules extracted from guidelines/sources/ into rules.json.
# Each rule must be checkable on a specification (stories, API, data model, decisions) or on a build.
# Fields: id, section, rule, level (MUST/SHOULD/MAY), applies_to, check (tool/test/review/none), check_hint, steps, notes.

sources:
  MACH:
    title: MACH architecture (Microservices, API-first, Cloud-native, Headless)
    reference: MACH Alliance, https://machalliance.org/ ; the rules are the factory's reading of the four principles
  MSV:
    title: Microservices
    reference: J. Lewis and M. Fowler, "Microservices" (2014); S. Newman, "Building Microservices" (2nd ed., 2021); C. Richardson, microservices.io patterns
  OWT:
    title: OWASP Top 10:2025, as checks on specifications
    reference: OWASP Top 10:2025, https://top10.owasp.org/2025/ (CC BY 3.0). Category ids and titles from OWASP; the rule wording is the factory's
  OWA:
    title: OWASP API Security Top 10 2023, as checks on specifications
    reference: OWASP API Security Top 10 2023, https://api-security.owasp.org/editions/2023/en/0x11-t10/ . Category ids and titles from OWASP; the rule wording is the factory's
  REUSE:
    title: Reuse first (frameworks, products, protocols, patterns)
    reference: "the factory's own rules; background in ISO/IEC 25010:2023 (maintainability: reusability, modularity), T. Erl, SOA Principles of Service Design (2007, service reusability), and the EU Interoperability Framework (2017, recommendation on reuse)"
  NFR:
    title: Non-functional requirements (quality attributes), measurable and tested
    reference: "ISO/IEC 25010:2023 quality model (characteristic names); L. Bass, P. Clements, R. Kazman, Software Architecture in Practice (4th ed., 2021, quality attribute scenarios). The rule wording is the factory's"
  SOA:
    title: Service-oriented design principles and patterns, where MACH and MSV do not already cover them
    reference: "T. Erl, SOA Principles of Service Design (2007) and SOA Design Patterns (2009). Principles already covered elsewhere are not repeated: standardised contract (MACH-03, MACH-05), loose coupling (MACH-02), statelessness (MACH-06), reusability of components (REUSE-). The rule wording is the factory's"

rules:
  # ---- MACH -------------------------------------------------------------------------------
  - {id: MACH-01, section: Microservices, level: SHOULD, applies_to: [process, code, config], check: review,
     rule: "Each component can be built, deployed and scaled on its own, without deploying another component at the same time.",
     check_hint: "Look for release or deployment steps that require two components together; shared deployment units.", steps: [23, 50, 70]}
  - {id: MACH-02, section: Microservices, level: MUST, applies_to: [api-spec, data-model, code], check: review,
     rule: "Components talk to each other only through published APIs or events, never through another component's database or internals.",
     check_hint: "Stories, decisions or code that read or write another component's store, files or classes.", steps: [21, 23, 50, 70]}
  - {id: MACH-03, section: API-first, level: MUST, applies_to: [api-spec, process], check: review,
     rule: "Every capability a component offers is defined as an API contract (OpenAPI or AsyncAPI) before or together with its implementation.",
     check_hint: "Stories with behaviour that no operation or event describes; operations that exist only in code. In step 70 the API is fuzzed against the contract (fuzz_api.py).", steps: [21, 30, 50, 70]}
  - {id: MACH-04, section: API-first, level: MUST, applies_to: [api-spec, ui], check: review,
     rule: "The user interface uses the same public API as any other client; there is no private back channel between UI and backend.",
     check_hint: "UI stories that need data or actions no public operation offers; UI-only endpoints.", steps: [21, 50, 60]}
  - {id: MACH-05, section: API-first, level: MUST, applies_to: [api-spec], check: review,
     rule: "API contracts are versioned and published; a breaking change gets a new major version, and the old one stays available for a stated period.",
     check_hint: "Version in the base path and info.version; a deprecation policy; breaking changes within one major version.", steps: [21, 70]}
  - {id: MACH-06, section: Cloud-native, level: SHOULD, applies_to: [code, config], check: review,
     rule: "Services are stateless between requests; state lives in a managed store, so any instance can serve any request.",
     check_hint: "Session state, local files or in-memory caches that a second instance would not see.", steps: [50, 70]}
  - {id: MACH-07, section: Cloud-native, level: MUST, applies_to: [config, code], check: review,
     rule: "Configuration and secrets come from the environment, not from the code or the image.",
     check_hint: "Hard-coded URLs, credentials or environment names; secrets in the repository.", steps: [50, 70]}
  - {id: MACH-08, section: Cloud-native, level: MUST, applies_to: [api-spec, code, config], check: test,
     rule: "Each service exposes health (liveness and readiness) so the platform can restart it and route traffic only when it is ready.",
     check_hint: "Health operations in the API or the platform configuration; readiness that checks its own dependencies.", steps: [21, 50, 70]}
  - {id: MACH-09, section: Cloud-native, level: SHOULD, applies_to: [code, config], check: review,
     rule: "Services run in containers and scale horizontally; they start fast and stop gracefully.",
     check_hint: "Container image, no fixed instance count, shutdown handling.", steps: [50, 70]}
  - {id: MACH-10, section: Headless, level: MUST, applies_to: [api-spec, code], check: review,
     rule: "The backend has no presentation logic: it returns data, never rendered pages or UI layout, so any client can be built on it.",
     check_hint: "Operations that return HTML or UI layout; texts formatted for one screen. Generated documents (for example a human-readable contract) are content, not layout, and must say so.", steps: [21, 23, 50]}
  - {id: MACH-11, section: Headless, level: SHOULD, applies_to: [ui], check: review,
     rule: "The user interface can be replaced without changing the backend.",
     check_hint: "Backend decisions that depend on one UI's flow or wording.", steps: [50, 60]}

  # ---- Microservices ----------------------------------------------------------------------
  - {id: MSV-01, section: Boundaries, level: MUST, applies_to: [data-model, api-spec], check: review,
     rule: "Each service covers one bounded context with one clear responsibility; a concept is owned by exactly one service.",
     check_hint: "Two services that both create or change the same concept; see DDD-13.", steps: [23, 30]}
  - {id: MSV-02, section: Data, level: MUST, applies_to: [data-model, code], check: review,
     rule: "Each service owns its data store; no other service reads or writes it directly.",
     check_hint: "Shared schemas or databases between components.", steps: [23, 50, 70]}
  - {id: MSV-03, section: Communication, level: SHOULD, applies_to: [api-spec, process], check: review,
     rule: "A change of state another service must know about is published as an event; the publisher does not wait for the consumers.",
     check_hint: "Synchronous call chains for notifications; status changes that the other party never learns about.", steps: [21, 23, 30]}
  - {id: MSV-04, section: Communication, level: MUST, applies_to: [api-spec, code], check: review,
     rule: "Event consumers are idempotent: receiving the same event twice has the same effect as receiving it once.",
     check_hint: "Event ids, deduplication, at-least-once delivery stated in the decisions.", steps: [30, 50, 70]}
  - {id: MSV-05, section: Communication, level: SHOULD, applies_to: [api-spec], check: review,
     rule: "Events and messages are described in a published contract (AsyncAPI) with their channel, payload and owner.",
     check_hint: "Topics or queues used in stories or decisions with no AsyncAPI.", steps: [21, 23]}
  - {id: MSV-06, section: Resilience, level: MUST, applies_to: [process, code], check: review,
     rule: "For each dependency, the behaviour when it is slow or down is defined: timeout, retries with backoff, and what the caller sees.",
     check_hint: "Same question as check AC-C07 of step 20b; decisions with a timeout and an error per dependency.", steps: [20, 30, 50, 70]}
  - {id: MSV-07, section: Resilience, level: SHOULD, applies_to: [code], check: test,
     rule: "Calls to other services are protected against cascading failure (circuit breaker or bulkhead).",
     check_hint: "A failing dependency must not exhaust threads or connections of the caller.", steps: [50, 70]}
  - {id: MSV-08, section: Consistency, level: MUST, applies_to: [process, code], check: review,
     rule: "A business flow across services has no distributed transaction; it uses a saga with compensating steps, and each step's failure outcome is defined.",
     check_hint: "Multi-party flows (for example offer, sign, store) and what happens when a middle step fails.", steps: [22, 30, 50]}
  - {id: MSV-09, section: Observability, level: MUST, applies_to: [api-spec, code], check: review,
     rule: "A correlation id travels with every request and event across services and appears in every log line about it.",
     check_hint: "Correlation header in the API; logging rules.", steps: [21, 50, 70]}
  - {id: MSV-10, section: Observability, level: SHOULD, applies_to: [code, config], check: review,
     rule: "Services write structured logs and expose metrics; no service needs a debugger in production to be understood.",
     check_hint: "Log format, metrics endpoint, the business logging contract of the project.", steps: [50, 70]}
  - {id: MSV-11, section: Evolution, level: SHOULD, applies_to: [api-spec, tests], check: test,
     rule: "Changes to an API stay backward compatible within a major version, checked by contract tests from the consumers' side.",
     check_hint: "Consumer-driven contract tests; additive changes only.", steps: [40, 70]}

  # ---- OWASP Top 10:2025, on specifications -----------------------------------------------
  - {id: OWT-A01, section: "A01:2025 Broken Access Control", level: MUST, applies_to: [api-spec, process], check: review,
     rule: "Every operation states who may call it (role or scope), and every operation on an object states whose objects the caller may reach.",
     check_hint: "Operations without a role; object ids in paths without an ownership rule; see OWA-API1 and OWA-API5.", steps: [20, 21, 30, 70]}
  - {id: OWT-A02, section: "A02:2025 Security Misconfiguration", level: MUST, applies_to: [config, api-spec], check: review,
     rule: "Defaults are secure: no debug or admin endpoints exposed, cross-origin access limited, and error responses that do not reveal internals.",
     check_hint: "Debug or actuator operations in the API; stack traces or class names in error examples.", steps: [21, 50, 70]}
  - {id: OWT-A03, section: "A03:2025 Software Supply Chain Failures", level: MUST, applies_to: [pipeline, code], check: tool,
     rule: "Dependencies are pinned, listed in a software bill of materials, and scanned for known vulnerabilities in the pipeline, with the scan blocking on high findings.",
     check_hint: "Lock files, SBOM, dependency and container scans that fail the build.", steps: [50, 70]}
  - {id: OWT-A04, section: "A04:2025 Cryptographic Failures", level: MUST, applies_to: [api-spec, config, code], check: review,
     rule: "Data in transit uses TLS, sensitive data at rest is encrypted, standard libraries are used for cryptography, and keys and secrets are never in code or logs.",
     check_hint: "http server URLs; secrets in examples; home-made signing.", steps: [21, 50, 70]}
  - {id: OWT-A05, section: "A05:2025 Injection", level: MUST, applies_to: [api-spec, code], check: review,
     rule: "All input is validated against a schema with types, formats and limits, queries are parameterised, and content from another party is encoded or sanitised before it is shown or stored.",
     check_hint: "Free strings without maxLength or pattern; HTML or markup received from another party (see the run 1 miss on offer HTML).", steps: [20, 21, 30, 50]}
  - {id: OWT-A06, section: "A06:2025 Insecure Design", level: SHOULD, applies_to: [process, tests], check: review,
     rule: "The main business flows have their abuse cases written down as acceptance criteria or decisions, next to the normal cases.",
     check_hint: "Stories with only happy and validation paths; no criterion on misuse.", steps: [20, 30]}
  - {id: OWT-A07, section: "A07:2025 Authentication Failures", level: MUST, applies_to: [api-spec, code], check: review,
     rule: "Tokens are validated on every call (signature, issuer, audience, expiry), credentials never appear in URLs, and repeated failures are limited.",
     check_hint: "API keys or tokens in query parameters; no 401 behaviour; no rate limit on login or token use.", steps: [21, 30, 50, 70]}
  - {id: OWT-A08, section: "A08:2025 Software or Data Integrity Failures", level: MUST, applies_to: [process, code, pipeline], check: review,
     rule: "Data and artefacts from outside are verified before use (signatures, checksums), and untrusted data is never deserialised into code objects.",
     check_hint: "Signed credentials or documents that are stored without verifying the signature; unsigned images.", steps: [20, 30, 50, 70]}
  - {id: OWT-A09, section: "A09:2025 Security Logging and Alerting Failures", level: MUST, applies_to: [process, code], check: review,
     rule: "Security-relevant events (login failures, access denied, administrative changes) are logged without sensitive data and can raise an alert.",
     check_hint: "Audit stories; logging decisions; personal data in log examples.", steps: [20, 30, 50, 70]}
  - {id: OWT-A10, section: "A10:2025 Mishandling of Exceptional Conditions", level: MUST, applies_to: [process, api-spec, code], check: review,
     rule: "Errors and unexpected states have defined outcomes, the system fails closed (denies when unsure), and no error leaves a half-done change behind.",
     check_hint: "Criteria for technical failures; what state remains after a failed step; see MSV-08.", steps: [20, 30, 50, 70]}

  # ---- OWASP API Security Top 10 2023, on specifications ----------------------------------
  - {id: OWA-API1, section: "API1:2023 Broken Object Level Authorization", level: MUST, applies_to: [api-spec, process], check: review,
     rule: "Every operation that takes an object id checks that the caller may access that object, and the rule is stated in the specs.",
     check_hint: "Paths with {id} and no ownership or visibility rule in stories or decisions.", steps: [20, 21, 30]}
  - {id: OWA-API2, section: "API2:2023 Broken Authentication", level: MUST, applies_to: [api-spec], check: review,
     rule: "Every operation except health requires authentication, the security scheme is defined, and the 401 behaviour is specified.",
     check_hint: "Same as OWT-A07; operations without security.", steps: [21, 30]}
  - {id: OWA-API3, section: "API3:2023 Broken Object Property Level Authorization", level: MUST, applies_to: [api-spec], check: review,
     rule: "Responses expose only the properties the caller may see, and requests accept only the properties the caller may set (no mass assignment).",
     check_hint: "One schema used for create, update and read; server-managed fields (ids, status, owner) accepted in requests; additionalProperties allowed.", steps: [21, 30, 50]}
  - {id: OWA-API4, section: "API4:2023 Unrestricted Resource Consumption", level: MUST, applies_to: [api-spec, config], check: review,
     rule: "Limits are specified for page sizes, request and upload sizes, batch sizes and call rates, with the response when a limit is hit.",
     check_hint: "Lists without a maximum page size; uploads without a size; no 413 or 429.", steps: [20, 21, 30]}
  - {id: OWA-API5, section: "API5:2023 Broken Function Level Authorization", level: MUST, applies_to: [api-spec, process], check: review,
     rule: "Administrative and state-changing operations are separated from read operations by role, and the role per operation is stated.",
     check_hint: "Operations that change state reachable with a read role or a shared API key.", steps: [21, 30]}
  - {id: OWA-API6, section: "API6:2023 Unrestricted Access to Sensitive Business Flows", level: SHOULD, applies_to: [process, api-spec], check: review,
     rule: "Business flows that can be abused by automation (bulk requests, repeated offers) have a limit or a check stated in the specs.",
     check_hint: "Flows that create obligations or cost for another party without a limit.", steps: [20, 30]}
  - {id: OWA-API7, section: "API7:2023 Server Side Request Forgery", level: MUST, applies_to: [api-spec, code], check: review,
     rule: "An operation that makes the server call a URL given by a client restricts the targets (allow list, scheme, no redirects) and says so.",
     check_hint: "Webhook, callback or import URLs in requests (the Schema Manager webhook finding, 17 Nov 2026).", steps: [21, 30, 50]}
  - {id: OWA-API8, section: "API8:2023 Security Misconfiguration", level: SHOULD, applies_to: [api-spec, config], check: review,
     rule: "The API states its transport and header rules: TLS only, allowed origins, security headers, and no verbose errors.",
     check_hint: "Server URLs with http; no CORS decision.", steps: [21, 50, 70]}
  - {id: OWA-API9, section: "API9:2023 Improper Inventory Management", level: MUST, applies_to: [api-spec, process], check: review,
     rule: "Every exposed operation is documented, owned and backed by a requirement; undocumented, legacy or test operations are retired.",
     check_hint: "Coverage check COV-01 of step 21: operations no story covers; old versions still served.", steps: [21, 30]}
  - {id: OWA-API10, section: "API10:2023 Unsafe Consumption of APIs", level: MUST, applies_to: [process, code], check: review,
     rule: "Data received from other services or third-party APIs is validated like user input, and the behaviour on invalid or missing data is specified.",
     check_hint: "Callbacks and responses from other components used without validation; trust between components assumed.", steps: [20, 30, 50]}

  # ---- REUSE ------------------------------------------------------------------------------
  - {id: REUSE-01, section: Security functions, level: MUST, applies_to: [code], check: review,
     rule: "Security functions (authentication, token validation, cryptography, password and secret handling) use an established, maintained library or product; the component does not implement them itself.",
     check_hint: "Own JWT parsing or signature checks, own hashing or encryption code, own login handling.", steps: [50, 70]}
  - {id: REUSE-02, section: Standard formats, level: SHOULD, applies_to: [code], check: review,
     rule: "Standard formats (JSON, XML, RDF, CSV, dates and times, URIs, multipart) are read and written with established libraries, not with hand-written parsers or string building.",
     check_hint: "Regular expressions or string concatenation that parse or produce a standard format.", steps: [50, 70]}
  - {id: REUSE-03, section: Infrastructure, level: SHOULD, applies_to: [code, config], check: review,
     rule: "Infrastructure capabilities (data store, identity provider, message broker, cache, scheduler, search, gateway) are existing products configured for the component, not built inside it.",
     check_hint: "Own storage engine, own queue, own scheduler or own token issuer inside the component.", steps: [30, 50, 70]}
  - {id: REUSE-04, section: Standard protocols, level: MUST, applies_to: [api-spec, code], check: review,
     rule: "Interfaces use the standard protocol or format where one exists (HTTP with OpenAPI, OAuth 2.0 and OpenID Connect, JSON, RFC 9457 problem details, AsyncAPI and CloudEvents for events); no own protocol or envelope.",
     check_hint: "Custom authentication headers, own error envelopes, own message framing.", steps: [21, 30, 50, 70],
     notes: "Overlaps the Belgif rules (BLG-) for HTTP details; this rule is about the choice of protocol."}
  - {id: REUSE-05, section: Project reuse catalogue, level: SHOULD, applies_to: [process, code], check: review,
     rule: "Before a capability is built, the project's reuse catalogue is checked; a capability the catalogue offers is reused, or the reason not to reuse it is recorded.",
     check_hint: "Compare REUSE.md of the build with the project's reuse catalogue (project.yaml reuse_catalogue).", steps: [30, 50, 70],
     notes: "Needs a reuse catalogue in the project. Without one, the rule applies to the build profile only."}
  - {id: REUSE-06, section: Named patterns, level: SHOULD, applies_to: [code, docs], check: review,
     rule: "A recurring design problem is solved with a known, named pattern (design, integration or architecture pattern), and the design notes name the pattern and where it is used.",
     check_hint: "Design notes that name no pattern; home-grown solutions to problems with a well-known pattern.", steps: [50, 70],
     notes: "A pattern is used only for the problem it solves; a pattern without that problem is a finding too (see GOF rules when present)."}
  - {id: REUSE-07, section: Reuse record, level: MUST, applies_to: [docs], check: review,
     rule: "Every build records its reuse decisions in REUSE.md: per capability, the framework, product, protocol or pattern reused, or why it was built instead.",
     check_hint: "REUSE.md present and complete against the capabilities the decisions name.", steps: [50, 70]}
  - {id: REUSE-08, section: Library health, level: SHOULD, applies_to: [code, pipeline], check: tool,
     rule: "Reused libraries and images are mainstream and maintained: a release in the last 12 months, a licence compatible with the project licence, and no known CRITICAL vulnerability without a recorded reason.",
     check_hint: "SBOM plus a vulnerability scan (for example Trivy) and a licence check of the SBOM.", steps: [50, 70],
     notes: "See OWT-A03 for the scan itself."}
  - {id: REUSE-09, section: Framework use, level: SHOULD, applies_to: [code], check: review,
     rule: "Frameworks are extended through their configuration and extension points; framework or library code is not copied, patched or forked into the component.",
     check_hint: "Vendored library sources, copied framework classes, patches applied at build time.", steps: [50, 70]}
  - {id: REUSE-10, section: Shared code, level: MAY, applies_to: [code, process], check: review,
     rule: "Code that more than one component needs is offered as one shared library or service, not copied between components.",
     check_hint: "The same helper or model code in several components.", steps: [23, 70]}
  # ---- NFR --------------------------------------------------------------------------------
  - {id: NFR-01, section: Coverage of quality attributes, level: MUST, applies_to: [process], check: review,
     rule: "Each component has non-functional requirements for at least performance efficiency, reliability (availability and recovery), capacity and maintainability, each with a measurable target.",
     check_hint: "Missing characteristics; targets without a number and a unit.", steps: [20, 30],
     notes: "Security is covered by the OWT- and OWA- rules and the project's own rules; usability by NFR-10."}
  - {id: NFR-02, section: Measurable form, level: MUST, applies_to: [process], check: review,
     rule: "An NFR states the measure, the target with its unit, and the condition (load, data volume, environment), for example: 95th percentile response time of the list operation below 300 ms with 50 concurrent users.",
     check_hint: "Words such as fast, scalable, robust or user-friendly without a measure.", steps: [20, 30, 40]}
  - {id: NFR-03, section: Performance, level: SHOULD, applies_to: [tests], check: test,
     rule: "Response time and throughput targets are checked with a load test at the stated load, reported per operation (p50, p95, p99, error rate).",
     check_hint: "A load test script (for example Locust or k6) next to the suite, run in step 70.", steps: [40, 70]}
  - {id: NFR-04, section: Limits, level: MUST, applies_to: [api-spec, code], check: test,
     rule: "Limits are stated and enforced (request size, file size, page size, number of items, call rate); beyond a limit the component answers with a defined error, never with a crash or a timeout.",
     check_hint: "Tests just above each limit; operations without a stated limit.", steps: [30, 40, 50, 70],
     notes: "See OWA-API4 for the security side."}
  - {id: NFR-05, section: Bounded resources, level: SHOULD, applies_to: [code, config], check: review,
     rule: "Resource use is bounded: no unbounded queries, result lists, caches, queues or thread pools, and every container has memory and CPU limits.",
     check_hint: "Queries without a limit, caches without eviction, containers without limits.", steps: [50, 70]}
  - {id: NFR-06, section: Availability and recovery, level: MUST, applies_to: [process, docs], check: review,
     rule: "The component states its availability target, recovery time objective and recovery point objective, and how its data is backed up and restored; the restore is tested.",
     check_hint: "No backup or restore procedure; a restore that was never run.", steps: [30, 50, 70]}
  - {id: NFR-07, section: Health and shutdown, level: SHOULD, applies_to: [code, config], check: test,
     rule: "The component exposes health and readiness, and shuts down gracefully: in-flight requests finish or get a defined error, and nothing is left half written.",
     check_hint: "Health endpoint; stop the container during a write and check the store.", steps: [40, 50, 70]}
  - {id: NFR-08, section: Observability, level: SHOULD, applies_to: [code], check: review,
     rule: "The component writes structured logs with a correlation id, exposes metrics for request rate, errors and duration per operation, and passes trace context to the services it calls.",
     check_hint: "Unstructured logs, no metrics endpoint, no trace propagation.", steps: [50, 70]}
  - {id: NFR-09, section: Maintainability, level: SHOULD, applies_to: [code, tests], check: tool,
     rule: "Maintainability is measured: own test line coverage at least the project's target (default 80%), a mutation score, static analysis without HIGH findings, and a stated limit on method complexity.",
     check_hint: "JaCoCo or equivalent, PIT or equivalent, a static analyser (for example Semgrep, SpotBugs, ESLint).", steps: [50, 70]}
  - {id: NFR-10, section: Usability and accessibility, level: SHOULD, applies_to: [ui], check: test,
     rule: "The user interface meets WCAG 2.1 level AA (as EN 301 549 asks for public services in the EU).",
     check_hint: "axe checks per main page in step 60; manual check of what axe marks incomplete.", steps: [40, 60, 70]}
  - {id: NFR-11, section: Portability, level: SHOULD, applies_to: [config], check: review,
     rule: "The component runs from a container image on any conformant platform, with configuration only through environment variables or mounted files and no host-specific paths.",
     check_hint: "Hard-coded hosts, paths or ports; configuration baked into the image.", steps: [50, 70],
     notes: "Overlaps MACH-07; this rule adds the configuration part."}
  - {id: NFR-12, section: Scalability, level: SHOULD, applies_to: [process, docs], check: review,
     rule: "The component states the load it is designed for (users, requests per second, data volume) and how it scales, including which parts hold state.",
     check_hint: "No design load; state that blocks a second instance without saying so.", steps: [30, 50, 70],
     notes: "See MACH-06 for statelessness."}
  - {id: NFR-13, section: Verification of NFRs, level: MUST, applies_to: [process, tests], check: review,
     rule: "Every NFR with a target has a test or a measurement in step 70, or is listed as not measured with the reason.",
     check_hint: "Step 70 report: NFR table with target, measured value and verdict.", steps: [40, 70]}
  # ---- SOA --------------------------------------------------------------------------------
  - {id: SOA-01, section: Service abstraction, level: MUST, applies_to: [api-spec], check: review,
     rule: "The contract exposes only what consumers need: no implementation details such as the store technology, internal ids, internal states, framework names or class names.",
     check_hint: "Field or parameter names that reveal the store or framework; internal enum values; stack traces in error bodies.", steps: [21, 70]}
  - {id: SOA-02, section: Consumer-agnostic contract, level: SHOULD, applies_to: [api-spec], check: review,
     rule: "Operations are designed for the business capability, not for one known consumer: names and fields come from the domain, not from one screen or one client.",
     check_hint: "Operations shaped after one UI screen; fields that only one client uses; consumer names in paths.", steps: [21, 30],
     notes: "See MACH-04: the UI is one consumer among others."}
  - {id: SOA-03, section: Service discoverability, level: SHOULD, applies_to: [api-spec, docs], check: review,
     rule: "Every service contract is published with the metadata a consumer needs to find and judge it: purpose, owner, version and status, limits and availability, and a contact.",
     check_hint: "info.description, contact, version and lifecycle status in the OpenAPI; the service listed in the project's registry or catalogue.", steps: [21, 70],
     notes: "Projects often fix the contact and licence fields in their own API rules; cite both."}
  - {id: SOA-04, section: Service composability, level: SHOULD, applies_to: [api-spec], check: review,
     rule: "Each operation performs one complete business step that a consumer can combine with others; a consumer never needs a fixed sequence of fine-grained calls to complete one step.",
     check_hint: "Create flows that need several calls in a set order; operations that leave the resource half done.", steps: [21, 30]}
  - {id: SOA-05, section: Service autonomy, level: SHOULD, applies_to: [api-spec, code], check: review,
     rule: "A service can serve every operation that does not need another service while that service is down; the operations that do need one say so in the contract.",
     check_hint: "Reads that fail when an unrelated dependency is down; no statement of which operations depend on what.", steps: [30, 50, 70],
     notes: "MSV-06 defines the behaviour per dependency; this rule is about which operations stay available."}
  - {id: SOA-06, section: Contract centralisation, level: SHOULD, applies_to: [api-spec, pipeline], check: review,
     rule: "There is one published contract per service version, and both the service and its clients are checked against that contract, not against copies of it.",
     check_hint: "Several copies of the OpenAPI that differ; clients built from an older copy; no contract test. In step 70 the API is fuzzed against the contract (fuzz_api.py).", steps: [21, 70],
     notes: "See MSV-11 for contract tests from the consumers' side."}
  - {id: SOA-07, section: Canonical data within a domain, level: SHOULD, applies_to: [data-model, api-spec], check: review,
     rule: "Services within one domain use the same data model for the concepts they share; between domains, one side translates explicitly at the boundary.",
     check_hint: "The same concept with different fields or names in two services of one domain; models from another domain used unchanged.", steps: [23, 30],
     notes: "Erl's canonical schema, bounded by DDD bounded contexts (DDD-13 to DDD-15): one model per context, translation between contexts."}
  - {id: SOA-08, section: Service policy, level: SHOULD, applies_to: [api-spec, docs], check: review,
     rule: "The non-functional terms of a contract are published with it: limits, availability, authentication, and how long a version is supported.",
     check_hint: "Limits and support periods only in code or in people's heads.", steps: [21, 30],
     notes: "The targets themselves are NFR rules and Q decisions; this rule is about publishing them."}
  - {id: SOA-09, section: Unambiguous contract, level: SHOULD, applies_to: [api-spec], check: tool,
     rule: "No two paths of a contract can match the same URL: a fixed segment does not sit where another path on the same level has a path parameter (for example /items/search next to /items/{name}).",
     check_hint: "check_api.py in step 21 compares every pair of paths; step 70 fuzzing shows the effect (wrong status or Allow header on the fixed path).", steps: [21, 70],
     notes: "A pattern on the parameter that excludes the fixed word does not help in practice: most routers match on the path shape and ignore the pattern."}
